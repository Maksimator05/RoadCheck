services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadcheck
      POSTGRES_PASSWORD: roadcheck
      POSTGRES_DB: roadcheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadcheck -d roadcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://roadcheck:roadcheck@db:5432/roadcheck
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      ML_MODEL_PATH: "${ML_MODEL_PATH:-app/ml/weights/best.pt}"
      ML_DEVICE: "${ML_DEVICE:-cpu}"
    volumes:
      - ./backend/app/ml/weights:/app/app/ml/weights:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-18080}:80"

volumes:
  postgres_data:
